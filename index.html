<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Millionaire</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---- blinking lights border ---- */
  .frame {
    position: fixed;
    inset: 6px;
    border-radius: 12px;
    pointer-events: none;
    z-index: 100;
    background:
      radial-gradient(circle, var(--c) 3.5px, transparent 4.5px) center/18px 18px repeat-x;
    height: 18px;
    animation: chase 1s steps(2) infinite;
    top: 6px; left: 6px; right: 6px;
  }
  .frame.bottom { top: auto; bottom: 6px; }
  .frame.left, .frame.right {
    width: 18px; height: auto; top: 24px; bottom: 24px;
    background: radial-gradient(circle, var(--c) 3.5px, transparent 4.5px) center/18px 18px repeat-y;
  }
  .frame.left  { left: 6px; right: auto; }
  .frame.right { left: auto; right: 6px; }
  .frame.a { --c: #ffd23f; animation-delay: 0s; }
  .frame.b { --c: #ff3d5a; animation-delay: .25s; }
  .frame.a, .frame.b { opacity: .9; }
  @keyframes chase { 0% { filter: brightness(1.4); } 100% { filter: brightness(.55); } }

  /* ---- layout ---- */
  main {
    padding: 64px 16px 48px;
    max-width: 520px;
    margin: 0 auto;
    position: relative;
  }

  h1 {
    text-align: center;
    font-size: 1.6rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #2f7bff, #66d9ff, #2f7bff);
    background-size: 200%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 3s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes shine { to { background-position: 200%; } }

  /* ---- screen states ---- */
  .hidden { display: none !important; }

  /* ---- start screen ---- */
  #start-screen { text-align: center; }
  #start-screen p { color: #9db4d8; margin: 12px 0 28px; }

  .big-btn {
    display: inline-block;
    background: linear-gradient(180deg, #2f7bff, #1a4fb8);
    border: 1px solid #4d95ff;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 16px 42px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(47,123,255,.55), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .1s;
  }
  .big-btn:active { transform: scale(.96); }

  /* ---- prize ladder ---- */
  .ladder {
    list-style: none;
    display: flex;
    flex-direction: column-reverse;
    gap: 4px;
    margin: 24px auto 0;
    max-width: 320px;
    text-align: right;
  }
  .ladder li {
    color: #8fb0e8;
    font-size: .85rem;
    padding: 4px 12px;
    border-right: 2px solid #23406e;
    font-variant-numeric: tabular-nums;
  }
  .ladder li .n { color: #54719f; margin-right: 8px; font-size: .75rem; }
  .ladder li.done { color: #ffd23f; border-right-color: #ffd23f; }
  .ladder li.current {
    background: #1a4fb8;
    color: #fff;
    font-weight: 700;
    border-radius: 4px;
    box-shadow: 0 0 12px rgba(47,123,255,.6);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 50% { box-shadow: 0 0 22px rgba(47,123,255,.9); } }

  /* ---- game screen ---- */
  .round-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .round-label { color: #9db4d8; font-size: .9rem; letter-spacing: 1px; }

  /* timer */
  .timer { position: relative; width: 64px; height: 64px; }
  .timer svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .timer .track { fill: none; stroke: #12233f; stroke-width: 6; }
  .timer .ring {
    fill: none; stroke: #2f7bff; stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: 188.5;
    transition: stroke-dashoffset 1s linear, stroke .5s;
  }
  .timer.danger .ring { stroke: #ff3d5a; }
  .timer .num {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .timer.danger .num { color: #ff3d5a; animation: flash .5s steps(2) infinite; }
  @keyframes flash { 50% { opacity: .3; } }

  .question-box {
    background: linear-gradient(180deg, #12233f, #0c1830);
    border: 1px solid #2f7bff;
    border-radius: 10px;
    padding: 22px 16px;
    min-height: 110px;
    display: flex;
    align-items: center;
    text-align: center;
    font-size: 1.1rem;
    line-height: 1.45;
    margin-bottom: 20px;
    box-shadow: inset 0 0 24px rgba(47,123,255,.15);
  }

  .answers { display: grid; gap: 12px; }
  .answer {
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(180deg, #1a4fb8, #123a8c);
    border: 1px solid #3f85ff;
    border-radius: 10px;
    color: #fff;
    font-size: 1rem;
    padding: 15px 14px;
    text-align: left;
    cursor: pointer;
    transition: transform .08s, opacity .3s;
    box-shadow: 0 0 10px rgba(47,123,255,.25);
  }
  .answer:active { transform: scale(.97); }
  .answer .key {
    flex: 0 0 30px;
    height: 30px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,.4);
    border-radius: 6px;
    font-weight: 700;
    font-size: .9rem;
    background: rgba(0,0,0,.25);
  }
  .answer.correct {
    background: linear-gradient(180deg, #1fae5a, #127a3c);
    border-color: #35d67a;
    box-shadow: 0 0 20px rgba(53,214,122,.7);
    animation: pop .4s ease;
  }
  .answer.wrong {
    background: linear-gradient(180deg, #c2273c, #8c1220);
    border-color: #ff5a70;
    box-shadow: 0 0 20px rgba(255,61,90,.7);
  }
  .answer.dimmed { opacity: .25; }
  .answers.locked .answer { pointer-events: none; }
  @keyframes pop { 50% { transform: scale(1.03); } }

  .next-up {
    margin-top: 18px;
    color: #9db4d8;
    font-size: .85rem;
    text-align: center;
  }
  .next-up strong { color: #ffd23f; }

  /* ---- end screens ---- */
  .end-screen { text-align: center; padding-top: 40px; }
  .end-screen .trophy { font-size: 4rem; margin-bottom: 12px; }
  .end-screen h2 { font-size: 1.5rem; letter-spacing: 2px; margin-bottom: 8px; }
  .end-screen .prize {
    font-size: 2.2rem;
    font-weight: 800;
    color: #ffd23f;
    text-shadow: 0 0 18px rgba(255,210,63,.6);
    margin: 14px 0 8px;
    font-variant-numeric: tabular-nums;
  }
  .end-screen p { color: #9db4d8; margin-bottom: 30px; }
</style>
</head>
<body>

<div class="frame a"></div>
<div class="frame b bottom"></div>
<div class="frame a left"></div>
<div class="frame b right"></div>

<main>
  <h1>Who Wants to Be a Millionaire?</h1>

  <!-- START -->
  <section id="start-screen">
    <p>10 questions. 30 seconds each. Answer in order —<br>one miss and the run ends.</p>
    <button class="big-btn" onclick="startGame()">START</button>
    <ul class="ladder" id="ladder-start"></ul>
  </section>

  <!-- GAME -->
  <section id="game-screen" class="hidden">
    <div class="round-row">
      <span class="round-label" id="round-label"></span>
      <div class="timer" id="timer">
        <svg viewBox="0 0 72 72">
          <circle class="track" cx="36" cy="36" r="30"/>
          <circle class="ring" id="ring" cx="36" cy="36" r="30"/>
        </svg>
        <div class="num" id="timer-num">30</div>
      </div>
    </div>

    <div class="question-box" id="question-box"></div>
    <div class="answers" id="answers"></div>
    <div class="next-up" id="next-up"></div>
  </section>

  <!-- END -->
  <section id="end-screen" class="hidden end-screen">
    <div class="trophy" id="end-emoji">🏆</div>
    <h2 id="end-title"></h2>
    <div class="prize" id="end-prize"></div>
    <p id="end-sub"></p>
    <button class="big-btn" onclick="location.reload()">PLAY AGAIN</button>
  </section>
</main>

<script>
const PRIZES = [100, 500, 1000, 5000, 10000, 25000, 50000, 100000, 250000, 1000000];
const KEYS = ['A', 'B', 'C', 'D'];
const SECONDS_PER_ROUND = 30;
const RING_CIRC = 2 * Math.PI * 30;

const QUESTIONS = [
  { q: 'What is the official currency of South Africa?',
    a: ['The Cedi', 'The Rand', 'The Shilling', 'The Kwacha'], c: 1 },
  { q: 'In SA banking, what does EFT stand for?',
    a: ['Electronic Funds Transfer', 'Electronic Fee Transfer', 'Electronic First Transfer', 'Electronic Funds Tracking'], c: 0 },
  { q: 'Which of these banks is NOT one of South Africa\'s Big Four?',
    a: ['Standard Bank', 'First National Bank', 'Absa', 'Capitec'], c: 3 },
  { q: 'What is FICA?',
    a: ['A type of home loan', 'A monthly account fee', 'The legal process of verifying a customer\'s identity', 'A credit scoring agency'], c: 2 },
  { q: 'Which institution is South Africa\'s central bank?',
    a: ['SARS', 'The SA Revenue Authority', 'NERSA', 'The South African Reserve Bank (SARB)'], c: 3 },
  { q: 'What is a debit order?',
    a: ['A one-off debit card purchase', 'A pre-approved standing instruction to pay a bill regularly', 'An overdraft facility', 'A salary credited to your account'], c: 1 },
  { q: 'The repurchase (repo) rate is…',
    a: ['Set by the SARB and influences the interest rates banks charge', 'A fee for cross-border EFTs', 'The minimum wage set annually', 'A tax on credit card interest'], c: 0 },
  { q: 'SAQR is…',
    a: ['A salary payment code', 'The standard for in-store QR code payments in South Africa', 'A bank branch identifier', 'A type of cheque'], c: 1 },
  { q: 'What is SWIFT?',
    a: ['A SA debit card brand', 'A global network for secure bank-to-bank messaging', 'The SA stock exchange', 'An online banking app'], c: 1 },
  { q: 'Which authority operates South Africa\'s instant payments system?',
    a: ['The Cheque Clearing Society', 'FSCA', 'SAIPSA — the South African Instant Payments System Authority', 'The CrossBorder Express network'], c: 2 },
];

// ---- state ----
let round = 0;
let left = SECONDS_PER_ROUND;
let ticking = null;
let locked = false;

const $ = id => document.getElementById(id);
const fmt = n => '$' + n.toLocaleString('en-US');

function show(id) {
  ['start-screen', 'game-screen', 'end-screen'].forEach(s => $(s).classList.toggle('hidden', s !== id));
}

function renderLadder(current, bestDone) {
  const ul = $('ladder-start');
  ul.innerHTML = '';
  PRIZES.forEach((p, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="n">${i + 1}.</span>${fmt(p)}`;
    if (i <= bestDone) li.classList.add('done');
    ul.appendChild(li);
  });
  return ul;
}
renderLadder(-1, -1);

function startGame() {
  round = 0;
  show('game-screen');
  loadRound();
}

function loadRound() {
  locked = false;
  left = SECONDS_PER_ROUND;
  $('round-label').textContent = `QUESTION ${round + 1} OF 10 — ${fmt(PRIZES[round])}`;
  $('question-box').textContent = QUESTIONS[round].q;

  const box = $('answers');
  box.classList.remove('locked');
  box.innerHTML = '';
  QUESTIONS[round].a.forEach((ans, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer';
    btn.innerHTML = `<span class="key">${KEYS[i]}</span><span>${ans}</span>`;
    btn.onclick = () => pick(i, btn);
    box.appendChild(btn);
  });

  const next = round < 9
    ? `Next up: <strong>${fmt(PRIZES[round + 1])}</strong>`
    : `<strong>TOP PRIZE — ${fmt(PRIZES[9])}</strong>`;
  $('next-up').innerHTML = next;

  updateTimerUI();
  restartTimer();
}

function restartTimer() {
  clearInterval(ticking);
  updateTimerUI();
  ticking = setInterval(() => {
    left--;
    if (left <= 0) {
      left = 0;
      clearInterval(ticking);
      updateTimerUI();
      timeUp();
    } else {
      updateTimerUI();
    }
  }, 1000);
}

function updateTimerUI() {
  $('timer-num').textContent = left;
  const ring = $('ring');
  ring.style.strokeDashoffset = RING_CIRC * (1 - left / SECONDS_PER_ROUND);
  const danger = left <= 10;
  $('timer').classList.toggle('danger', danger);
  // danger color for ring handled via class
  ring.style.stroke = danger ? '#ff3d5a' : '#2f7bff';
}

function pick(i, btn) {
  if (locked) return;
  locked = true;
  clearInterval(ticking);
  const box = $('answers');
  box.classList.add('locked');
  const correct = QUESTIONS[round].c;
  btn.classList.add(i === correct ? 'correct' : 'wrong');
  if (i !== correct) box.children[correct].classList.add('correct');

  setTimeout(() => {
    if (i === correct) {
      round++;
      if (round >= 10) endGame(true);
      else loadRound();
    } else {
      endGame(false);
    }
  }, 1400);
}

function timeUp() {
  if (locked) return;
  locked = true;
  const box = $('answers');
  box.classList.add('locked');
  [...box.children].forEach((el, i) => el.classList.add('dimmed'));
  box.children[QUESTIONS[round].c].classList.remove('dimmed');
  box.children[QUESTIONS[round].c].classList.add('correct');
  setTimeout(() => endGame(false), 1600);
}

function endGame(won) {
  clearInterval(ticking);
  if (won) {
    $('end-emoji').textContent = '🏆';
    $('end-title').textContent = 'YOU ARE A MILLIONAIRE!';
    $('end-prize').textContent = fmt(1000000);
    $('end-sub').textContent = 'All 10 answered correctly. Legendary.';
  } else {
    $('end-emoji').textContent = '💥';
    $('end-title').textContent = round === 0 ? 'BUSTED' : 'GAME OVER';
    // take-home: prize of the last question answered (previous level), or 0
    const takeHome = round > 0 ? PRIZES[round - 1] : 0;
    $('end-prize').textContent = fmt(takeHome);
    $('end-sub').textContent = round === 0
      ? `You got ${round} of 10 right. The money is gone.`
      : `You got ${round} of 10 right. ${fmt(takeHome)} is yours to keep.`;
  }
  show('end-screen');
}
</script>
</body>
</html>
